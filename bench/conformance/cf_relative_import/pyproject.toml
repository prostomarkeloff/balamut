[project]
name = "cf_relative_import"
version = "0.1.0"
requires-python = ">=3.14"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cf_relative_import"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
