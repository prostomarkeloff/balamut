[project]
name = "cf_cov_config"
version = "0.1.0"
requires-python = ">=3.14"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cf_cov_config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=cf_cov_config --cov-report="
