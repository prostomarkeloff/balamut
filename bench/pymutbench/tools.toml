# The benchmarked tools, in the order every table lists them before sorting. One table per tool:
#
#   version       the benchmarked release
#   url           the project's home
#   install       pip requirements of the tool's environments (the generation image, the engine-track and trap images)
#   venv          the environment's directory name (/tools/<venv>, /native/<venv>)
#   adapter       the generation adapter in adapters/ (the tool's own generator, every native mutant as a file)
#   default_drop  native-id prefix of emissions outside the tool's default configuration (its benchmark row)
#   engine        how the tool's engine runs a mutant (the docs' tool table)
#
# A tool outside this registry is evaluated from its own mutants with `python3 -m pymutbench.submit evaluate`
# (bench/SUBMISSION.md); a tool in it gets a generation adapter and a campaign in native.py.

[tools.balamut]
version = "0.1.6"
url = "https://github.com/prostomarkeloff/balamut"
install = ["/wheels/balamut-0.1.6-py3-none-any.whl"]
venv = "balamut"
adapter = "ad_balamut.py"
engine = "resident pytest workers, in-memory code patching, coverage-selected tests"

[tools.mutmut]
version = "3.8.1"
url = "https://github.com/boxed/mutmut"
install = ["mutmut==3.8.1"]
venv = "mutmut"
adapter = "ad_mutmut.py"
engine = "trampolined function variants, forked workers"

[tools.cosmic-ray]
version = "8.7.0"
url = "https://github.com/sixty-north/cosmic-ray"
install = ["cosmic-ray==8.7.0"]
venv = "cosmic-ray"
adapter = "ad_cosmic_ray.py"
engine = "file rewrite, one test-command run per mutant"

[tools.poodle]
version = "1.4.0"
url = "https://github.com/WiredNerd/poodle"
install = ["poodle==1.4.0"]
venv = "poodle"
adapter = "ad_poodle.py"
engine = "file rewrite in copied trial folders, parallel"

[tools.pytest-gremlins]
version = "1.13.2"
url = "https://github.com/mikelane/pytest-gremlins"
install = ["pytest-gremlins==1.13.2"]
venv = "gremlins"
adapter = "ad_gremlins.py"
engine = "mutation switching (instrumented AST), subprocess per gremlin"

[tools.pytest-leela]
version = "0.9.0"
url = "https://github.com/markng/pytest-leela"
install = ["pytest-leela==0.9.0"]
venv = "leela"
adapter = "ad_leela.py"
engine = "in-process import-hook AST mutation, type-aware operators"

[tools.mutation]
version = "0.6.0"
url = "https://github.com/amirouche/mutation.py"
install = ["mutation==0.6.0"]
venv = "mutation"
adapter = "ad_mutation.py"
engine = "pytest plugin installing the patched module, coverage-gated"

[tools.universalmutator]
version = "1.14.1"
url = "https://github.com/agroce/universalmutator"
install = ["universalmutator==1.14.1"]
venv = "universalmutator"
adapter = "ad_universalmutator.py"
engine = "regular-expression mutants as files, one test command per mutant"

[tools.fest]
version = "0.1.3"
url = "https://github.com/sakost/fest"
install = ["fest-mutate==0.1.3", "pytest-cov"]
venv = "fest"
adapter = "ad_fest.py"
engine = "Rust driver, pytest plugin or subprocess backend"

[tools.irradiate]
version = "0.4.3"
url = "https://github.com/nwyin/irradiate"
install = ["irradiate==0.4.3"]
venv = "irradiate"
adapter = "ad_irradiate.py"
engine = "Rust driver, trampolines, pre-warmed forked pytest workers"

[tools.deployproof]
version = "1.1.19"
url = "https://github.com/SVSPraveen/deployproof"
install = ["deployproof==1.1.19"]
venv = "deployproof"
adapter = "ad_deployproof.py"
engine = "in-memory AST schemata on a diff or explicit files"
