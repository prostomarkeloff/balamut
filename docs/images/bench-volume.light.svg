<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' role="img" aria-label="Detection grows with the number of mutants">
<title>Detection grows with the number of mutants</title>
<rect width="760" height="460" fill="#fcfcfb" rx="8"/>
<text x="24.0" y="28.0" fill="#0b0b0b" font-size="15" font-weight="600" text-anchor="start" dominant-baseline="middle">Detection grows with the number of mutants</text>
<text x="24.0" y="48.0" fill="#52514e" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle">share of bugs with a pre-fix witness against the median number of in-scope emissions per bug</text>
<line x1="72" y1="404.0" x2="610" y2="404.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="64.0" y="404.0" fill="#898781" font-size="11" font-weight="400" text-anchor="end" dominant-baseline="middle">0%</text>
<line x1="72" y1="296.0" x2="610" y2="296.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="64.0" y="296.0" fill="#898781" font-size="11" font-weight="400" text-anchor="end" dominant-baseline="middle">10%</text>
<line x1="72" y1="188.0" x2="610" y2="188.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="64.0" y="188.0" fill="#898781" font-size="11" font-weight="400" text-anchor="end" dominant-baseline="middle">20%</text>
<line x1="72" y1="80.0" x2="610" y2="80.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="64.0" y="80.0" fill="#898781" font-size="11" font-weight="400" text-anchor="end" dominant-baseline="middle">30%</text>
<line x1="72.0" y1="80" x2="72.0" y2="404" stroke="#e1e0d9" stroke-width="1"/>
<text x="72.0" y="420.0" fill="#898781" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle">1</text>
<line x1="251.3" y1="80" x2="251.3" y2="404" stroke="#e1e0d9" stroke-width="1"/>
<text x="251.3" y="420.0" fill="#898781" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle">10</text>
<line x1="430.7" y1="80" x2="430.7" y2="404" stroke="#e1e0d9" stroke-width="1"/>
<text x="430.7" y="420.0" fill="#898781" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle">100</text>
<line x1="610.0" y1="80" x2="610.0" y2="404" stroke="#e1e0d9" stroke-width="1"/>
<text x="610.0" y="420.0" fill="#898781" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle">1,000</text>
<line x1="72" y1="404" x2="610" y2="404" stroke="#c3c2b7" stroke-width="1"/>
<text x="341.0" y="442.0" fill="#52514e" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle">in-scope emissions per bug (median, log scale)</text>
<text x="24.0" y="62.0" fill="#52514e" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle">bugs with a pre-fix witness</text>
<circle cx="404.0" cy="95.0" r="5" fill="#52514e"><title>balamut: 29% at 71</title></circle>
<text x="413.0" y="95.0" fill="#52514e" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="middle">balamut</text>
<circle cx="346.6" cy="234.5" r="5" fill="#52514e"><title>mutmut: 16% at 34</title></circle>
<text x="355.6" y="234.5" fill="#52514e" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="middle">mutmut</text>
<circle cx="359.3" cy="251.1" r="5" fill="#52514e"><title>cosmic-ray: 14% at 40</title></circle>
