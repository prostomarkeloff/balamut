<circle cx="384.1" cy="198.0" r="5" fill="#52514e"><title>universalmutator: 19% at 55</title></circle>
<text x="393.1" y="198.0" fill="#52514e" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="middle">universalmutator</text>
<circle cx="316.2" cy="267.8" r="5" fill="#52514e"><title>fest: 13% at 23</title></circle>
<text x="325.2" y="267.8" fill="#52514e" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="middle">fest</text>
<circle cx="355.3" cy="231.2" r="5" fill="#52514e"><title>irradiate: 16% at 38</title></circle>
<text x="364.3" y="231.2" fill="#52514e" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="middle">irradiate</text>
<circle cx="309.1" cy="251.1" r="5" fill="#52514e"><title>deployproof: 14% at 21</title></circle>
<text x="318.1" y="251.1" fill="#52514e" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="middle">deployproof</text>
</svg>
