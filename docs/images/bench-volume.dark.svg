<text x="64.0" y="80.0" fill="#898781" font-size="11" font-weight="400" text-anchor="end" dominant-baseline="middle">25%</text>
<line x1="72.0" y1="80" x2="72.0" y2="404" stroke="#2c2c2a" stroke-width="1"/>
<text x="72.0" y="420.0" fill="#898781" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle">1</text>
