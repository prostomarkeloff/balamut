<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' role="img" aria-label="Detection grows with the number of mutants">
<title>Detection grows with the number of mutants</title>
<rect width="760" height="460" fill="#1a1a19" rx="8"/>
<text x="24.0" y="28.0" fill="#f0efec" font-size="15" font-weight="600" text-anchor="start" dominant-baseline="middle">Detection grows with the number of mutants</text>
<text x="24.0" y="48.0" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle">share of bugs with a pre-fix witness against the median number of in-scope emissions per bug</text>
