<line x1="610.0" y1="80" x2="610.0" y2="404" stroke="#2c2c2a" stroke-width="1"/>
<text x="610.0" y="420.0" fill="#898781" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle">1,000</text>
<line x1="72" y1="404" x2="610" y2="404" stroke="#383835" stroke-width="1"/>
<text x="341.0" y="442.0" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle">in-scope emissions per bug (median, log scale)</text>
<text x="24.0" y="62.0" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle">bugs with a pre-fix witness</text>
