name: mutation

# The whole tree through balamut's own gate. Against the empty tree every line counts as changed, so the run also
# sees what the per-change gate of ci.yml cannot: a mutant that started to survive on a line nobody touched, after
# a test was weakened or removed. A cold run judges every mutant of the repository, hence the schedule; the run
# also starts for a pull request that changes this file.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/mutation.yml]

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BALAMUT_TEST_PG_HOST: 127.0.0.1
  BALAMUT_TEST_PG_PORT: "5432"
  BALAMUT_TEST_PG_USER: balamut
  BALAMUT_TEST_PG_PASSWORD: balamut

jobs:
  whole-tree:
    runs-on: ubuntu-latest
    # A cold run on a hosted runner takes about an hour; the verdicts it reached are cached even when it is cut off.
    timeout-minutes: 330
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: balamut
          POSTGRES_PASSWORD: balamut
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U balamut"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Sync
        run: uv sync --all-extras
      # The verdict cache of ci.yml: a run on the default branch leaves its verdicts to every later run.
      - name: Restore the verdict cache
        uses: actions/cache/restore@v6
        with:
          path: .balamut/cache
          key: balamut-verdicts-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: balamut-verdicts-
      - name: Mutation gate over the whole tree
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          mkdir -p "$RUNNER_TEMP/mutation"
          # A mutant that makes a loop grow a list without bound fills the runner's memory before the hang budget
          # ends; with 4 GiB of data per process its test fails with MemoryError instead.
          ulimit -d 4194304
          uv run balamut diff \
            --base "$(git hash-object -t tree /dev/null)" \
            --base-mode direct \
            --cache .balamut/cache/ci.sqlite \
            --report-json "$RUNNER_TEMP/mutation/report.json" \
            --html "$RUNNER_TEMP/mutation/report.html"
      - name: Save the verdict cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .balamut/cache
          key: balamut-verdicts-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: ${{ runner.temp }}/mutation
          if-no-files-found: ignore
