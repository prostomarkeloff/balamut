name: ci

on:
  push:
    branches: [main]
  pull_request:
  # A manual run of main releases its head: the version the commit sets, or the next patch version if it left the
  # released version unchanged.
  workflow_dispatch:

# A newer commit of a pull request supersedes the run of the older one. Every run of main is its own group: none
# waits for or cancels another, and a release in flight finishes.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BALAMUT_TEST_PG_HOST: 127.0.0.1
  BALAMUT_TEST_PG_PORT: "5432"
  BALAMUT_TEST_PG_USER: balamut
  BALAMUT_TEST_PG_PASSWORD: balamut

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: balamut
          POSTGRES_PASSWORD: balamut
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U balamut"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Sync
        run: uv sync --all-extras
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Type check
        run: uv run pyright
      - name: Test
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          uv run pytest -q

  # balamut gates its own change with its own suite: the mutants of the lines a pull request changes, or of the
  # lines main gained since the latest release. A fork has no release tags to measure main against, so there
  # only pull requests are gated.
  dogfood:
    if: github.event_name == 'pull_request' || !github.event.repository.fork
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: balamut
          POSTGRES_PASSWORD: balamut
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U balamut"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Sync
        run: uv sync --all-extras
      # The verdict cache is addressed by content: a restored one leaves only the mutants whose code or covering
      # tests changed. It is saved after a failed gate too, so the run that follows a fix starts warm.
      - name: Restore the verdict cache
        uses: actions/cache/restore@v6
        with:
          path: .balamut/cache
          key: balamut-verdicts-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: balamut-verdicts-
      - name: Mutation gate
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          mkdir -p "$RUNNER_TEMP/dogfood"
          # A mutant that makes a loop grow a list without bound fills the runner's memory before the hang budget
          # ends; with 4 GiB of data per process its test fails with MemoryError instead.
          ulimit -d 4194304
          uv run balamut diff \
            --base "${BASE:-$(git describe --tags --abbrev=0)}" \
            --cache .balamut/cache/ci.sqlite \
            --report-json "$RUNNER_TEMP/dogfood/report.json" \
            --html "$RUNNER_TEMP/dogfood/report.html"
      - name: Save the verdict cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .balamut/cache
          key: balamut-verdicts-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dogfood-report
          path: ${{ runner.temp }}/dogfood
          if-no-files-found: ignore

  # A green commit of main releases: the version its pyproject.toml sets, as a tag on the commit, the distributions
  # on PyPI (trusted publishing through the `pypi` environment) and a GitHub release. A commit that itself changes
  # the version releases exactly what it set — or nothing, when that version is already released. A commit that
  # leaves the version untouched gets the next patch version committed to main and released by the same run. A
  # manual run of the workflow releases the head under the same rule.
  release:
    needs: [check, dogfood]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !github.event.repository.fork
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: release
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Decide the version
        id: version
        run: |
          # Only the head of main is released: when main has moved on, the run of the newer commit releases it.
          git fetch --quiet origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "main has moved past $(git rev-parse --short HEAD): nothing to release here"
            exit 0
          fi
          # The version is whatever the commit says in pyproject.toml. A commit that itself changes the version
          # releases exactly what it set — or nothing, when that version is already released. Only a commit that
          # leaves the version untouched gets the next patch version, committed and released by this very run.
          latest=$(git tag --merged HEAD --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' pyproject.toml)
          if [ -z "$version" ]; then
            echo "pyproject.toml has no version: nothing to release"
            exit 1
          fi
          if [ -n "$(git tag --points-at HEAD --list "$version")" ]; then
            # A tag already on this commit is a release interrupted half-way: finish it under the same version.
            echo "version $version was tagged half-way through its release: finishing it"
          else
            prev=$(git show "HEAD^:pyproject.toml" 2>/dev/null | sed -n 's/^version = "\([^"]*\)"$/\1/p')
            if [ "$version" != "$prev" ]; then
              if [ -n "$(git tag --list "$version")" ]; then
                echo "version $version is already released: nothing to do"
                exit 0
              fi
              echo "the commit sets version $version: releasing it"
            elif [ -n "$latest" ] && [ "$version" = "$latest" ]; then
              # No version change in this commit and nothing ahead of the tags: the next patch version is
              # committed and released by this run. Only the patch part ever increments; anything else is a
              # change in the commit.
              IFS=. read -r major minor patch <<< "$version"
              next="$major.$minor.$((patch + 1))"
              sed -i "s/^version = \"$version\"$/version = \"$next\"/" pyproject.toml
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m "chore: bump version to $next" pyproject.toml
              version="$next"
              echo "no version change: bumped to $version and releasing it here"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build
        if: steps.version.outputs.version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv build
          test -f "dist/balamut-$VERSION-py3-none-any.whl"
          test -f "dist/balamut-$VERSION.tar.gz"
      - name: Publish
        if: steps.version.outputs.version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The bump commit made by this run goes to main here; a push with the default token does not trigger a
          # run of its own, so the release and the bump must happen in the same run.
          git push origin main
          [ -z "$(git tag --list "$VERSION")" ] && git tag "$VERSION"
          git push origin "refs/tags/$VERSION"
          uv publish --check-url https://pypi.org/simple/
          gh release view "$VERSION" > /dev/null 2>&1 ||
            gh release create "$VERSION" --verify-tag --title "balamut $VERSION" --generate-notes

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - name: Sync
        run: uv sync --all-extras
      - name: Lint
        run: uv run ruff check bench
      - name: Unit tests
        run: uv run python -m unittest discover -s bench/tests
      - name: The published report rebuilds from its data
        env:
          PMB_WORK: ${{ runner.temp }}/pymutbench
        run: |
          cd bench
          uv run python -m pymutbench.restore --results results
          uv run python -m pymutbench.report bugs --results "$RUNNER_TEMP/results" --images "$RUNNER_TEMP/images"
          uv run python -m pymutbench.check_rebuild results "$RUNNER_TEMP/results" ../docs/images "$RUNNER_TEMP/images"
